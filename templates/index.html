<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPN Fantasy Football Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 2rem; padding-bottom: 2rem; }
        .results-container { margin-top: 2rem; }
        #loading { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">ESPN Fantasy Football Data Tool</h1>

        <div class="card shadow-sm">
            <div class="card-body">
                <form id="fantasyForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="league_id" class="form-label">League ID (Required)</label>
                            <input type="number" class="form-control" id="league_id" required>
                        </div>
                        <div class="col-md-6">
                            <label for="year" class="form-label">Season Year</label>
                            <input type="number" class="form-control" id="year" placeholder="e.g., 2023 (leave blank for latest)">
                        </div>
                        <div class="col-md-6">
                            <label for="espn_s2" class="form-label">ESPN S2 Cookie (For Private Leagues)</label>
                            <input type="text" class="form-control" id="espn_s2">
                        </div>
                        <div class="col-md-6">
                            <label for="swid" class="form-label">SWID Cookie (For Private Leagues)</label>
                            <input type="text" class="form-control" id="swid">
                        </div>
                        <div class="col-12 mt-4">
                            <label class="form-label d-block">Action</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="action" id="action_draft" value="draft" checked>
                                <label class="btn btn-outline-primary" for="action_draft">Draft Recap</label>

                                <input type="radio" class="btn-check" name="action" id="action_rosters" value="rosters">
                                <label class="btn btn-outline-primary" for="action_rosters">All Rosters</label>

                                <input type="radio" class="btn-check" name="action" id="action_keepers" value="keepers">
                                <label class="btn btn-outline-primary" for="action_keepers">Keeper Analysis</label>
                            </div>
                        </div>
                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg px-5">Fetch Data</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="loading" class="text-center mt-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Fetching data from ESPN...</p>
        </div>

        <div class="results-container" id="resultsContainer" style="display: none;">
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Results</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0" id="resultsTable">
                            <thead class="table-dark" id="resultsHead">
                            </thead>
                            <tbody id="resultsBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div id="noDataMessage" class="alert alert-warning m-3" style="display: none;">
                No data found for the given configuration.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('fantasyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultsContainer = document.getElementById('resultsContainer');
            const loading = document.getElementById('loading');
            const table = document.getElementById('resultsTable');
            const noDataMsg = document.getElementById('noDataMessage');

            // UI reset
            resultsContainer.style.display = 'none';
            noDataMsg.style.display = 'none';
            table.style.display = 'table';
            loading.style.display = 'block';

            const payload = {
                league_id: document.getElementById('league_id').value,
                year: document.getElementById('year').value,
                espn_s2: document.getElementById('espn_s2').value,
                swid: document.getElementById('swid').value,
                action: document.querySelector('input[name="action"]:checked').value
            };

            try {
                const response = await fetch('/fetch_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to fetch data');
                }

                if (!result.data || result.data.length === 0) {
                    table.style.display = 'none';
                    noDataMsg.style.display = 'block';
                } else {
                    renderTable(result.columns, result.data);
                }

                resultsContainer.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        function renderTable(columns, data) {
            const thead = document.getElementById('resultsHead');
            const tbody = document.getElementById('resultsBody');

            // Clear existing content
            thead.innerHTML = '';
            tbody.innerHTML = '';

            // Format column names (e.g., "Player Name" instead of "player_name")
            const formattedColumns = columns.map(col => {
                // Capitalize first letter and replace underscores
                return col.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
            });

            // Create header row safely
            const trHead = document.createElement('tr');
            formattedColumns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // Create data rows safely
            data.forEach(row => {
                const tr = document.createElement('tr');
                columns.forEach(col => {
                    const td = document.createElement('td');
                    td.textContent = row[col] !== undefined ? row[col] : 'N/A';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
